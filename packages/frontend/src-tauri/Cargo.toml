[package]
name = "bluelight-hub-frontend"
version = "0.1.0"
description = "Bluelight Hub (Katastrophenschutz)"
authors = ["Ruben Vitt"]
license = "WIP"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-http = "2.5.6"
tauri-plugin-store = "2.4.2"
tauri-plugin-barcode-scanner = "2.4.3"
tauri-plugin-deep-link = "2.4.6"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-notification = "2"

# Audio playback für Erinnerungs-Sounds (funktioniert auch bei minimierter App)
rodio = "0.19"
